<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Une classe d'arabe Alfasl</title>
  <desc id="desc">Scène chaleureuse d'une classe d'arabe vue de dos : un enseignant devant un tableau et des élèves à leurs bureaux, sans visage visible.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf8ed"/><stop offset="1" stop-color="#e8f0e8"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6edda"/><stop offset="1" stop-color="#e7d8b8"/></linearGradient>
    <linearGradient id="chalkboard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b675b"/><stop offset="1" stop-color="#013d37"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d77c"/><stop offset="1" stop-color="#af7d25"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd8153"/><stop offset="1" stop-color="#75462f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#263b32" flood-opacity=".18"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="19"/></filter>
    <pattern id="arabesque" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M50 3C50 29 29 50 3 50c26 0 47 21 47 47 0-26 21-47 47-47C71 50 50 29 50 3Z" fill="none" stroke="#0b675b" stroke-opacity=".08" stroke-width="2"/><circle cx="50" cy="50" r="6" fill="#d5ae47" fill-opacity=".1"/></pattern>
  </defs>

  <!-- Interior -->
  <rect width="1440" height="900" rx="50" fill="url(#room)"/>
  <rect width="1440" height="590" fill="url(#wall)"/><rect width="1440" height="590" fill="url(#arabesque)"/>
  <ellipse cx="720" cy="590" rx="610" ry="72" fill="#e6cb83" opacity=".23" filter="url(#soft)"/>
  <path d="M0 585H1440V900H0Z" fill="#d5ad76"/><path d="M0 585H1440" stroke="#a97347" stroke-width="12"/>
  <path d="M0 770 1440 660M0 870 1440 760" stroke="#b68155" stroke-width="5" opacity=".36"/>
  <path d="M78 0v356c0-156 126-282 282-282s282 126 282 282V0" fill="#0a5d53" opacity=".08"/>
  <path d="M1362 0v356c0-156-126-282-282-282S798 200 798 356V0" fill="#0a5d53" opacity=".08"/>
  <g fill="url(#gold)" filter="url(#shadow)"><path d="M148 70h44l-8 63h-28Z"/><path d="M1248 70h44l-8 63h-28Z"/><circle cx="170" cy="150" r="20"/><circle cx="1270" cy="150" r="20"/></g>

  <!-- Blackboard -->
  <g filter="url(#shadow)"><rect x="365" y="82" width="710" height="373" rx="22" fill="#c39136"/><rect x="383" y="100" width="674" height="337" rx="12" fill="url(#chalkboard)"/><rect x="383" y="100" width="674" height="337" rx="12" fill="url(#arabesque)" opacity=".52"/><rect x="345" y="449" width="750" height="22" rx="11" fill="url(#gold)"/></g>
  <g font-family="Noto Naskh Arabic, Amiri, serif" text-anchor="middle"><text x="720" y="221" font-size="111" fill="#fff7db">الفَصْل</text><text x="720" y="268" font-size="29" fill="#f2d77c" letter-spacing="3">مَكَانٌ لِلتَّعَلُّمِ وَالنُّمُوِّ</text><path d="M526 303h388" stroke="#f8ecd0" stroke-width="3" opacity=".52"/><text x="560" y="370" font-size="55" fill="#f8ecd0" opacity=".9">ب</text><text x="720" y="370" font-size="55" fill="#f8ecd0" opacity=".9">ت</text><text x="880" y="370" font-size="55" fill="#f8ecd0" opacity=".9">ث</text></g>
  <g fill="#f2d77c"><circle cx="505" cy="366" r="5"/><circle cx="550" cy="366" r="5"/><circle cx="665" cy="366" r="5"/><circle cx="715" cy="366" r="5"/><circle cx="875" cy="349" r="5"/><circle cx="892" cy="349" r="5"/><circle cx="909" cy="349" r="5"/></g>

  <!-- Teacher, shown from behind -->
  <g filter="url(#shadow)"><ellipse cx="1112" cy="498" rx="42" ry="48" fill="#8a5a3f"/><path d="M1062 502c6-65 43-97 93-97 45 0 76 37 76 94v168h-170Z" fill="#075b50"/><path d="M1080 444c10-52 61-80 105-52 20 13 28 37 27 67-32-22-73-19-132 13Z" fill="#f3d77b"/><path d="M1081 460c39-18 92-21 130 6-2-29-7-48-27-63-43-29-89 1-103 57Z" fill="#0b675b"/><path d="M1090 572h104v122h-104Z" fill="#06463f"/><path d="M1093 694h37l7 88h-49ZM1156 694h37l11 88h-49Z" fill="#253c36"/><path d="m1040 531 20-12 76 73-14 14Z" fill="#8a5a3f"/><path d="m1001 462 11 8 69 107-12 8Z" fill="#c49639"/><circle cx="1005" cy="464" r="9" fill="#f4d87d"/></g>

  <!-- Bookshelf -->
  <g transform="translate(105 220)" filter="url(#shadow)"><rect width="164" height="315" rx="12" fill="#8a583a"/><rect x="13" y="15" width="138" height="275" rx="5" fill="#f4e5bd"/><path d="M13 103h138M13 195h138" stroke="#8a583a" stroke-width="11"/><g><rect x="26" y="33" width="21" height="57" rx="3" fill="#0b675b"/><rect x="51" y="20" width="19" height="70" rx="3" fill="#d5a839"/><rect x="74" y="40" width="25" height="50" rx="3" fill="#844e37"/><rect x="103" y="27" width="17" height="63" rx="3" fill="#275b78"/><rect x="26" y="125" width="18" height="57" rx="3" fill="#a26343"/><rect x="48" y="116" width="25" height="66" rx="3" fill="#0b675b"/><rect x="77" y="132" width="16" height="50" rx="3" fill="#d5a839"/><rect x="97" y="119" width="27" height="63" rx="3" fill="#4f6687"/><rect x="26" y="218" width="26" height="58" rx="3" fill="#0b675b"/><rect x="56" y="207" width="17" height="69" rx="3" fill="#d5a839"/><rect x="77" y="225" width="22" height="51" rx="3" fill="#8a583a"/><rect x="103" y="212" width="20" height="64" rx="3" fill="#486881"/></g></g>

  <!-- Students at desks: all seated and viewed from behind, no faces -->
  <g filter="url(#shadow)">
    <g transform="translate(340 560)"><path d="M0 40h225l-18 88H18Z" fill="url(#wood)"/><path d="M16 128h21l-10 89H6ZM187 128h21l12 89h-21Z" fill="#70412e"/><ellipse cx="68" cy="10" rx="31" ry="36" fill="#80543c"/><path d="M24 51c8-38 75-48 91 0v65H24Z" fill="#e1b94d"/><ellipse cx="161" cy="8" rx="31" ry="36" fill="#a66e4d"/><path d="M116 51c8-39 77-48 92 0v65h-92Z" fill="#315b78"/><path d="M39 65c9-22 48-29 65-3" fill="none" stroke="#f7e4b6" stroke-width="4" opacity=".6"/></g>
    <g transform="translate(668 560)"><path d="M0 40h225l-18 88H18Z" fill="url(#wood)"/><path d="M16 128h21l-10 89H6ZM187 128h21l12 89h-21Z" fill="#70412e"/><ellipse cx="68" cy="10" rx="31" ry="36" fill="#9b6549"/><path d="M24 51c8-38 75-48 91 0v65H24Z" fill="#0b675b"/><ellipse cx="161" cy="8" rx="31" ry="36" fill="#754b37"/><path d="M116 51c8-39 77-48 92 0v65h-92Z" fill="#b47a42"/><path d="M131 64c16-22 52-22 66 1" fill="none" stroke="#f8e4b2" stroke-width="4" opacity=".6"/></g>
    <g transform="translate(474 714)"><path d="M0 42h455l-26 92H25Z" fill="url(#wood)"/><path d="M29 134h28l-14 74H14ZM393 134h28l16 74h-29Z" fill="#70412e"/><ellipse cx="128" cy="10" rx="38" ry="43" fill="#9d694b"/><path d="M76 61c7-47 96-51 105 0v74H76Z" fill="#456987"/><ellipse cx="322" cy="10" rx="38" ry="43" fill="#87563d"/><path d="M269 61c7-47 97-51 106 0v74H269Z" fill="#d7ab40"/><path d="M100 10c4-37 46-48 61-15 4 9 5 18 3 28-20-11-42-12-64-4Z" fill="#163f3b"/><path d="M292 13c7-34 46-44 62-16 6 10 7 20 4 31-19-15-40-16-66-7Z" fill="#075b50"/><rect x="154" y="58" width="145" height="18" rx="4" fill="#fff9e8" transform="rotate(-3 154 58)"/><path d="M171 67h82" stroke="#0b675b" stroke-width="3" opacity=".5"/></g>
  </g>
  <g fill="none" stroke="#0b675b" stroke-width="5" stroke-linecap="round" opacity=".32"><path d="M83 690c-26 34-23 67 9 96 26 23 61 19 79-8"/><path d="M1280 718c-4 40 18 70 57 79 32 7 59-13 62-46"/></g><g fill="url(#gold)"><circle cx="83" cy="690" r="9"/><circle cx="171" cy="778" r="9"/><circle cx="1280" cy="718" r="9"/><circle cx="1399" cy="751" r="9"/></g>
</svg>
